name: Update AltStore source

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download release IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --pattern '*.ipa' --dir "$RUNNER_TEMP"

      - name: Update source
        run: python3 updatesource.py source.json "$GITHUB_EVENT_PATH" "$RUNNER_TEMP"

      - name: Commit source update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- source.json; then
            exit 0
          fi
          git add source.json
          author_name=$(git log -1 --format=%an -- source.json)
          author_email=$(git log -1 --format=%ae -- source.json)
          git -c user.name="$author_name" -c user.email="$author_email" commit -m "chore: update AltStore source"
          git push origin "HEAD:$DEFAULT_BRANCH"
